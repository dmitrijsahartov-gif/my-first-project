<title>Лёгкость</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column phone app — hero calorie card, colour-coded tiles per metric, bottom tab bar, bottom sheets for input.
   Each metric owns one colour everywhere: calories = tangerine, steps = teal, water = blue, weight = berry, fat = sun. */
:root{
  --bg:#F3F6EC; --surface:#FFFFFF; --surface-2:#EAEFDF; --fg:#1B2116; --muted:#667060; --line:#DCE3D0;
  --kcal:#FF5F2E; --kcal-2:#FFB020; --steps:#0FA996; --steps-2:#7BD88F; --water:#2F86F6; --water-2:#7CC4FF;
  --weight:#E23D82; --weight-2:#FF8FB1; --protein:#E23D82; --fat:#F2A900; --carbs:#0FA996;
  --ok:#2E9E4F; --warn:#E08A00; --bad:#D33A2C;
  --on-color:#FFFFFF; --shadow:0 10px 30px -18px rgba(40,60,20,.45);
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11140E; --surface:#1A1F15; --surface-2:#232A1D; --fg:#EDF2E4; --muted:#9BA591; --line:#2E3727;
  --kcal:#FF7448; --kcal-2:#FFBE3D; --steps:#2CC7B2; --steps-2:#8FE6A0; --water:#5AA2FF; --water-2:#94D0FF;
  --weight:#FF5A9C; --weight-2:#FFA3C2; --protein:#FF5A9C; --fat:#FFC233; --carbs:#2CC7B2;
  --ok:#5BCB7A; --warn:#FFB340; --bad:#FF6B5C; --on-color:#FFFFFF; --shadow:0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11140E; --surface:#1A1F15; --surface-2:#232A1D; --fg:#EDF2E4; --muted:#9BA591; --line:#2E3727;
  --kcal:#FF7448; --kcal-2:#FFBE3D; --steps:#2CC7B2; --steps-2:#8FE6A0; --water:#5AA2FF; --water-2:#94D0FF;
  --weight:#FF5A9C; --weight-2:#FFA3C2; --protein:#FF5A9C; --fat:#FFC233; --carbs:#2CC7B2;
  --ok:#5BCB7A; --warn:#FFB340; --bad:#FF6B5C; --on-color:#FFFFFF; --shadow:0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--water);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.hello{min-width:0}
.hello small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.hello h1{font-size:22px;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
.flame{width:16px;height:16px}

.demo{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r-md);
  background:var(--surface);border:1.5px dashed var(--kcal);margin-bottom:14px;font-size:14px}
.demo b{color:var(--kcal)}

.stack{display:grid;gap:14px}
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.eyebrow{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:30px;padding:20px;color:var(--on-color);
  background:radial-gradient(120% 90% at 100% 0%,var(--kcal-2) 0%,transparent 60%),linear-gradient(150deg,var(--kcal) 0%,var(--weight) 120%);box-shadow:0 18px 40px -22px var(--kcal)}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-80px;bottom:-110px;background:rgba(255,255,255,.12)}
.hero .eyebrow{color:rgba(255,255,255,.85)}
.hero-main{display:flex;align-items:center;gap:18px;margin-top:10px;position:relative;z-index:1}
.ring-wrap{position:relative;flex:none}
.ring-label{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-label b{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.ring-label span{font-size:12px;font-weight:700;opacity:.9;margin-top:4px}
.hero-stats{display:grid;gap:10px;min-width:0;flex:1}
.hs{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:7px}
.hs:last-child{border:0;padding:0}
.hs span{font-size:13px;font-weight:600;opacity:.92}
.hs b{font-family:var(--display);font-size:17px;font-weight:700}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;position:relative;z-index:1}
.macro{background:rgba(255,255,255,.17);border-radius:14px;padding:9px 10px;min-width:0}
.macro small{display:block;font-size:11.5px;font-weight:700;opacity:.92}
.macro b{font-size:14px;font-weight:800}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px;background:#fff}

/* tiles */
.tile{border-radius:var(--r-lg);padding:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0;display:grid;gap:8px}
.tile h3{font-size:24px;font-weight:800;line-height:1.05}
.tile h3 small{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.t-steps{background:linear-gradient(160deg,color-mix(in srgb,var(--steps) 16%,var(--surface)),var(--surface) 70%)}
.t-water{background:linear-gradient(160deg,color-mix(in srgb,var(--water) 16%,var(--surface)),var(--surface) 70%)}
.t-weight{background:linear-gradient(160deg,color-mix(in srgb,var(--weight) 14%,var(--surface)),var(--surface) 70%)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.glasses{display:flex;flex-wrap:wrap;gap:5px}
.glass{width:20px;height:26px;border-radius:4px 4px 7px 7px;border:2px solid var(--water);background:transparent;padding:0}
.glass.on{background:linear-gradient(to top,var(--water) 75%,var(--water-2))}
.mini-btns{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px}
.pill.c-steps{border-color:var(--steps);color:var(--steps)}
.pill.c-water{border-color:var(--water);color:var(--water)}
.pill.c-weight{border-color:var(--weight);color:var(--weight)}
.pill.c-kcal{border-color:var(--kcal);color:var(--kcal)}

/* motivation */
.quote{position:relative;overflow:hidden;background:var(--fg);color:var(--bg);border-radius:var(--r-lg);padding:20px 18px}
.quote p{font-family:var(--display);font-size:18px;font-weight:700;line-height:1.3;margin:6px 0 0;text-wrap:balance}
.quote .eyebrow{color:var(--kcal-2)}
.quote svg{position:absolute;right:-14px;top:-14px;width:90px;height:90px;opacity:.16}

/* meals */
.meal{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border:0}
.thumb{width:56px;height:56px;border-radius:14px;object-fit:cover;display:grid;place-content:center;font-family:var(--display);font-weight:800;font-size:20px;color:var(--on-color)}
.meal .info{min-width:0}
.meal .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal .info small{color:var(--muted);font-size:12.5px}
.meal .k{font-family:var(--display);font-weight:700;text-align:right}
.meal .k small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:600}
.del{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 0;text-decoration:underline}
.group-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.group-h h3{font-size:15px}
.empty{padding:18px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r-md)}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gallery figure{margin:0;position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;max-width:100%}
.gallery img{width:100%;height:100%;object-fit:cover}
.gallery figcaption{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* big metric */
.big{display:flex;gap:18px;align-items:center}
.big-num{font-family:var(--display);font-size:36px;font-weight:800;line-height:1}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface-2);border-radius:14px;padding:10px 12px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:11.5px;font-weight:700}
.stat b{font-family:var(--display);font-size:16px;font-weight:700}

.progress{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--weight-2),var(--weight))}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--surface-2)}

/* achievements */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{border-radius:18px;padding:12px 8px;text-align:center;background:var(--surface-2);min-width:0;display:grid;gap:4px;justify-items:center}
.badge svg{width:40px;height:40px}
.badge b{font-size:12px;line-height:1.2}
.badge small{font-size:10.5px;color:var(--muted);line-height:1.2}
.badge.off{opacity:.42;filter:grayscale(1)}
.level{display:flex;align-items:center;gap:14px}
.lvl{width:62px;height:62px;border-radius:20px;flex:none;display:grid;place-content:center;color:var(--on-color);font-family:var(--display);font-weight:800;font-size:24px;
  background:linear-gradient(140deg,var(--fat),var(--kcal))}

/* forms */
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:11px 12px;font-size:16px;min-width:0}
.input:focus{border-color:var(--kcal);outline:none}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 6px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 2px 8px -4px rgba(0,0,0,.3)}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:15.5px;background:var(--kcal);color:var(--on-color);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.wide{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.steps{background:var(--steps)}.btn.water{background:var(--water)}.btn.weight{background:var(--weight)}
.btn:disabled{opacity:.5}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{border:0;background:none;display:grid;justify-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:700;color:var(--muted);border-radius:12px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--fg)}
.nav button.on svg{color:var(--tabc)}
.fab{position:fixed;z-index:21;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));
  width:62px;height:62px;border-radius:22px;border:0;color:var(--on-color);display:grid;place-content:center;
  background:linear-gradient(140deg,var(--kcal-2),var(--kcal));box-shadow:0 14px 30px -12px var(--kcal)}
.fab svg{width:30px;height:30px}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(10,14,6,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:20px;font-weight:800}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice label,.choice button{position:relative;border-radius:20px;padding:16px 14px;border:0;text-align:left;display:grid;gap:6px;font-weight:800;color:var(--on-color);cursor:pointer;min-width:0}
.choice small{font-weight:600;opacity:.9;font-size:12px}
.choice svg{width:28px;height:28px}
.choice input{position:absolute;opacity:0;width:1px;height:1px}
.c1{background:linear-gradient(140deg,var(--kcal-2),var(--kcal))}
.c2{background:linear-gradient(140deg,var(--weight-2),var(--weight))}
.c3{background:linear-gradient(140deg,var(--steps-2),var(--steps))}
.c4{background:linear-gradient(140deg,var(--water-2),var(--water))}
.preview{width:100%;max-height:260px;object-fit:cover;border-radius:20px;max-width:100%}
.ai{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--kcal);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.item{display:grid;grid-template-columns:1fr 78px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item b{display:block;font-size:14px;line-height:1.25}
.item small{color:var(--muted);font-size:12px}
.item .input{padding:8px;font-size:15px;text-align:right}
.x{border:0;background:var(--surface-2);width:30px;height:30px;border-radius:10px;font-weight:800;color:var(--muted)}
.foods{display:grid;gap:2px;max-height:240px;overflow:auto;border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:4px}
.food{display:flex;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:10px}
.food:hover{background:var(--surface-2)}
.food span{color:var(--muted);font-size:12.5px;white-space:nowrap}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.totals div{background:var(--surface);border-radius:14px;padding:8px 10px;border:1px solid var(--line);min-width:0}
.totals small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.totals b{font-family:var(--display);font-size:15px}
.tip{padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--steps) 13%,var(--surface));font-size:14px}
.warnbox{padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--bad) 12%,var(--surface));font-size:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);
  padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.sync{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
@media (max-width:380px){.hero-main{flex-direction:column;align-items:stretch}.ring-wrap{align-self:center}.statgrid{grid-template-columns:1fr 1fr}.badges{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- calculations ---------- */
function bmr(p, w) { const s = 10 * w + 6.25 * p.height - 5 * p.age; return p.sex === "m" ? s + 5 : s - 161; } // Mifflin–St Jeor
function latestWeight() {

  return ks.length ? S.days[ks[ks.length - 1]].weight : (S.profile?.startWeight || 0);
}
function goals(p = S.profile, w = latestWeight()) {
  if (!p) return null;
  const tdee = bmr(p, w) * p.activity;
  const floor = p.sex === "m" ? 1500 : 1200;
  const kcal = Math.round(Math.max(floor, tdee - p.pace * 7700 / 7) / 10) * 10;
  const protein = Math.round(Math.min(w, p.goalWeight * 1.15) * 1.5);
  const fat = Math.round(kcal * 0.3 / 9);
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  return { tdee: Math.round(tdee), kcal, protein, fat, carbs, steps: p.stepsGoal || 10000, water: Math.round(w * 30 / 250) * 250, floorHit: tdee - p.pace * 7700 / 7 < floor };
}
function day(k) { return S.days[k] || { meals: [], steps: 0, water: 0, weight: null }; }
function sum(meals) { return meals.reduce((a, m) => ({ kcal: a.kcal + (+m.kcal || 0), p: a.p + (+m.p || 0), f: a.f + (+m.f || 0), c: a.c + (+m.c || 0) }), { kcal: 0, p: 0, f: 0, c: 0 }); }
const stepKcal = steps => steps * latestWeight() * 0.0005;
function streak() {
  let k = today(), n = 0;

  while (day(k).meals.length) { n++; k = addDays(k, -1); }
  return n;
}
function weights() { return Object.keys(S.days).filter(k => S.days[k].weight).sort().map(k => ({ k, w: S.days[k].weight })); }
function bmiInfo(w, h) {
  const b = w / ((h / 100) ** 2);
  const cat = b < 18.5 ? ["Дефицит массы", "warn"] : b < 25 ? ["Норма", "ok"] : b < 30 ? ["Избыточная масса", "warn"] : b < 35 ? ["Ожирение I ст.", "bad"] : b < 40 ? ["Ожирение II ст.", "bad"] : ["Ожирение III ст.", "bad"];
  return { b, cat };
}
function forecast() {
  const ws = weights().filter(x => x.k >= addDays(today(), -28));
  if (ws.length < 3) return null;
  const t0 = dateOf(ws[0].k).getTime(); const xs = ws.map(x => (dateOf(x.k).getTime() - t0) / 864e5), ys = ws.map(x => x.w);
  const n = xs.length, mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
  let num = 0, den = 0; xs.forEach((x, i) => { num += (x - mx) * (ys[i] - my); den += (x - mx) ** 2; });
  if (!den) return null; const slope = num / den; // kg per day
  const cur = latestWeight(), goal = S.profile.goalWeight;
  if (slope >= -0.005 || cur <= goal) return { slope, date: null };
  const daysLeft = Math.ceil((cur - goal) / -slope);
  return { slope, date: addDays(today(), daysLeft), daysLeft };
}
function xpAndBadges() {
  const g = goals(); const ks = Object.keys(S.days);
  let xp = 0, photos = 0, stepsDays = 0, waterDays = 0, inKcal = 0, meals = 0, max10k = 0;
  ks.forEach(k => { const d = S.days[k]; const s = sum(d.meals || []);
    meals += (d.meals || []).length; xp += (d.meals || []).length * 10;
    const ph = (d.meals || []).filter(m => m.photo).length; photos += ph; xp += ph * 5;
    if (d.steps >= g.steps) { stepsDays++; xp += 30; } if (d.steps >= 10000) max10k++;
    if (d.water >= g.water) { waterDays++; xp += 15; }
    if (d.weight) xp += 10;
    if ((d.meals || []).length >= 3 && s.kcal <= g.kcal * 1.05 && s.kcal >= g.kcal * 0.7) { inKcal++; xp += 20; }
  });
  const lost = (S.profile.startWeight || 0) - latestWeight(); const st = streak();
  let best = 0, run = 0; ks.sort().forEach((k, i) => { const prev = ks[i - 1]; run = (S.days[k].meals || []).length ? (prev && addDays(prev, 1) === k && (S.days[prev].meals || []).length ? run + 1 : 1) : 0; best = Math.max(best, run); });
  const B = [
    ["Первый шаг", "Записать первый приём пищи", meals >= 1, "kcal"],
    ["Фотограф", "5 фото еды", photos >= 5, "weight"],
    ["3 дня подряд", "Серия записей", Math.max(best, st) >= 3, "kcal"],

    ["10 000", "Пройти 10 000 шагов", max10k >= 1, "steps"],
    ["Ходок", "Цель по шагам 7 раз", stepsDays >= 7, "steps"],
    ["Водный баланс", "Норма воды 5 раз", waterDays >= 5, "water"],
    ["В рамках", "5 дней в норме калорий", inKcal >= 5, "kcal"],
    ["−1 кг", "Первый килограмм", lost >= 1, "weight"],
    ["−5 кг", "Пять килограммов", lost >= 5, "weight"],
    ["−10 кг", "Десять килограммов", lost >= 10, "fat"],
    ["У цели", "Достичь целевого веса", latestWeight() <= S.profile.goalWeight, "steps"]

  const level = Math.floor(Math.sqrt(xp / 60)) + 1;
  const curL = 60 * (level - 1) ** 2, nextL = 60 * level ** 2;
  return { xp, level, pct: (xp - curL) / (nextL - curL), toNext: nextL - xp, badges: B, name: LEVELS[Math.min(level - 1, LEVELS.length - 1)] };
}

/* ---------- persistence ---------- */
function persist(key) {
  if (S.demo) return;
  if (S.mode === "cloud" && S.col) {
    const data = key === "profile" ? S.profile : S.days[key.slice(2)];
    const ref = S.col.doc(key);
    S.queues[key] = (S.queues[key] || Promise.resolve()).then(() => data ? ref.set(JSON.parse(JSON.stringify(data))) : ref.delete())
      .catch(e => toast(e && e.code === "quota_exceeded" ? "Хранилище заполнено: удалите старые фото" : e && e.code === "invalid_argument" ? "Запись слишком большая — удалите пару фото за этот день" : "Не сохранилось: проверьте интернет"));
  } else lsSave();
}
function saveDay(k) { persist("d-" + k); }
function setDay(k, patch) { S.days[k] = Object.assign({ meals: [], steps: 0, water: 0, weight: null }, S.days[k], patch); saveDay(k); }

async function connect() {
  const local = lsLoad();
  const useLocal = () => {
    S.mode = "local"; S.ready = true;
    if (local && local.profile) { S.profile = local.profile; S.days = local.days || {}; S.demo = false; }
    render();
  };
  if (!window.claude || !window.claude.use) { useLocal(); return; }
  try {
    const [db, user, sample] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("sample")]);
    if (sample) { S.sample = sample; try { const lim = await sample.limits(); S.sampleImages = !!(lim && lim.images); } catch (e) {} }
    const id = db && user ? await user.id() : null;
    if (!db || !id) { useLocal(); return; }
    S.mode = "cloud"; S.col = db.collection("data/users/" + id);
    S.col.onSnapshot(snap => {
      const days = {}; let profile = null;
      snap.docs.forEach(d => { const v = d.data(); if (!v) return; if (d.id === "profile") profile = v; else if (d.id.startsWith("d-")) days[d.id.slice(2)] = v; });
      S.cloudLoaded = true; S.ready = true;
      if (profile) { S.profile = profile; S.days = days; S.demo = false; }
      else if (!S.demo) { S.profile = null; S.days = {}; }
      render();
    }, () => { toast("Связь с хранилищем потеряна — перезагрузите страницу"); });
  } catch (e) { useLocal(); }
}

function rerenderMeal() {

  openSheet(mealSheet()); const s2 = $(".sheet"); if (s2) { s2.style.animation = "none"; s2.scrollTop = st; }

function syncDraftFields() { if (!draft) return; const g = id => document.getElementById(id); if (g("mname")) draft.name = g("mname").value; if (g("mtype")) draft.type = g("mtype").value; if (g("mtime")) draft.time = g("mtime").value; if (g("hint")) draft.hint = g("hint").value; }
function addItem(name, g, per) { draft.items.push({ name, g, base: per, kcal: per.kcal * g / 100, p: per.p * g / 100, f: per.f * g / 100, c: per.c * g / 100 }); }
function setGrams(i, g) { const it = draft.items[i]; if (!it) return; it.g = g; ["kcal", "p", "f", "c"].forEach(x => it[x] = it.base[x] * g / 100); }

async function loadImage(file) {
  const url = URL.createObjectURL(file); const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  return img;
}
function scaled(img, max) { const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)); const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c; }
async function onPhoto(file) {
  if (!file) return;

  if (!draft) draft = newDraft(); syncDraftFields();
  try {
    const img = await loadImage(file);
    draft.photo = scaled(img, 360).toDataURL("image/jpeg", 0.62);
    draft.aiBlob = await new Promise(r => scaled(img, 1024).toBlob(r, "image/jpeg", 0.82));
    draft.ai = S.sample && S.sampleImages ? "ready" : "off";
  } catch (e) { toast("Не удалось открыть фото. Попробуйте JPEG или PNG"); return; }

  if (draft.ai === "ready") runAI();
}
async function runAI() {
  if (!draft || !draft.aiBlob || !S.sample) return; syncDraftFields();
  draft.ai = "busy"; rerenderMeal();
  const prompt = `Ты опытный нутрициолог. На фото приём пищи. Определи каждое блюдо или продукт и оцени массу порции по визуальным признакам (размер тарелки, приборы, толщина слоя). Считай реалистично, учитывай масло и соусы, если они видны.
${draft.hint ? "Уточнение от пользователя: " + draft.hint + "\n" : ""}Ответь ТОЛЬКО JSON без пояснений:
{"title":"короткое название приёма пищи на русском","items":[{"name":"продукт на русском","grams":число,"kcal":число,"protein":число,"fat":число,"carbs":число}],"tip":"один короткий дружелюбный совет по этой тарелке для снижения веса, до 110 символов"}
Числа — для всей порции этого продукта, не на 100 г. Если на фото не еда — верни пустой items и объясни в tip.`;
  try {
    const r = await S.sample.json(prompt, { images: [draft.aiBlob], modelTier: "default" });
    if (!draft) return;
    const items = Array.isArray(r && r.items) ? r.items : [];
    items.forEach(it => { const g = Math.max(1, +it.grams || 100); const per = { kcal: (+it.kcal || 0) * 100 / g, p: (+it.protein || 0) * 100 / g, f: (+it.fat || 0) * 100 / g, c: (+it.carbs || 0) * 100 / g }; addItem(String(it.name || "Блюдо").slice(0, 60), g, per); });

    if (!draft) return;

    toast(e && e.code === "not_granted" ? "Без разрешения Claude фото сохранится, а калории — вручную" : e && e.code === "rate_limited" ? "Слишком много запросов. Подождите минуту" : "Не получилось распознать. Нажмите «Посчитать» ещё раз или добавьте вручную");
  }

}
function saveMeal() {
  syncDraftFields(); const d = draft;
  const t = d.items.reduce((a, i) => ({ kcal: a.kcal + i.kcal, p: a.p + i.p, f: a.f + i.f, c: a.c + i.c }), { kcal: 0, p: 0, f: 0, c: 0 });
  if (!d.items.length && !d.photo) { toast("Добавьте фото или хотя бы один продукт"); return; }
  const name = d.name.trim() || (d.items[0] ? d.items.map(i => i.name).slice(0, 2).join(", ") : "Приём пищи");
  const meal = { id: uid(), name: name.slice(0, 80), type: d.type, time: d.time, kcal: Math.round(t.kcal), p: Math.round(t.p), f: Math.round(t.f), c: Math.round(t.c), items: d.items.map(i => ({ name: i.name, g: Math.round(i.g), kcal: Math.round(i.kcal) })) };
  if (d.photo) meal.photo = d.photo;
  const k = today(); const cur = day(k);
  const next = Object.assign({}, cur, { meals: (cur.meals || []).concat(meal) });
  if (JSON.stringify(next).length > 240000) { delete meal.photo; toast("За сегодня много фото — этот приём сохранён без снимка"); }
  const before = streak();
  setDay(k, { meals: (cur.meals || []).concat(meal) });
  closeSheet(); render();
  const g = goals(); const s = sum(day(k).meals);
  if (streak() > before && [3, 7, 14, 30].includes(streak())) { celebrate(); toast(`Серия ${streak()} ${plural(streak(), "день", "дня", "дней")}! Так держать`); }
  else toast(s.kcal > g.kcal ? `Записано. Сегодня +${fmt(s.kcal - g.kcal)} ккал к норме — прогулка поможет` : `Записано. Осталось ${fmt(g.kcal - s.kcal)} ккал`);
}

/* ---------- toast + confetti ---------- */
let tt; function toast(msg) { let el = $("#toast"); if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); } el.textContent = msg; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 3200); }
function celebrate() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"); c.hidden = false; const ctx = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cs = getComputedStyle(document.documentElement); const cols = ["--kcal", "--kcal-2", "--steps", "--water", "--weight", "--fat"].map(v => cs.getPropertyValue(v).trim());
  const ps = Array.from({ length: 120 }, () => ({ x: innerWidth / 2, y: innerHeight * 0.35, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 12 - 3, s: 5 + Math.random() * 6, r: Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)] }));
  let f = 0; (function tick() { ctx.clearRect(0, 0, c.width, c.height); ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.r += 0.15; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (++f < 110) requestAnimationFrame(tick); else { ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; } })();
}

document.addEventListener("click", e => {

    case "water": { const i = +el.dataset.i; const v = (i + 1) * 250 === d.water ? i * 250 : (i + 1) * 250; const before = d.water; setDay(k, { water: v }); render(); if (before < g.water && v >= g.water) toast("Норма воды выполнена!"); break; }

    case "weightSave": { const v = +String($("#numIn").value).replace(",", "."); if (!(v >= 35 && v <= 300)) { toast("Введите вес от 35 до 300 кг"); return; } const prev = latestWeight(); setDay(k, { weight: Math.round(v * 10) / 10 }); closeSheet(); render();
      const lost = S.profile.startWeight - v; if (Math.floor(lost) > Math.floor(S.profile.startWeight - prev) && lost >= 1) { celebrate(); toast(`Минус ${Math.floor(lost)} кг со старта!`); } else toast(v < prev ? `−${fmt1(prev - v)} кг. Отлично!` : "Записано. Смотрите на тренд, а не на один день"); break; }

  }
});

    $("#foods").innerHTML = FOODS.filter(f => !q || f.name.toLowerCase().includes(q)).slice(0, 40).map(f => `<button class="food" data-act="addFood" data-n="${esc(f.name)}"><b style="font-weight:600">${esc(f.name)}</b><span class="num">${f.kcal} ккал</span></button>`).join("") || `<div class="small muted" style="padding:10px">Не нашли — впишите ниже вручную</div>`; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheetRoot").innerHTML) closeSheet(); if (e.key === "Enter" && e.target.id === "numIn") { const b = $(".sheet [data-act$='Save']"); if (b) b.click(); } });

render();
connect();
})();
</script>
